name: CI & Evaluation Tracking

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test-and-eval:
    name: Test, Evaluation & Trend Tracking
    runs-on: ubuntu-latest
    environment: staging

    # Budget-friendly eval stack: a single fast, cheap, credit-affordable chat
    # model for all tiers. OpenRouter's :free tier proved unusable (throttled /
    # capacity-exhausted) and the default Claude slugs 402 on a low-credit key
    # because worst-case 64k output exceeds the balance. gemini-2.5-flash-lite
    # costs ~$0.20/M out, supports function calling, and passes the affordability
    # gate (~$0.026 worst case vs the key's balance).
    #
    # Embeddings: qwen/qwen3-embedding-4b flaps to a batch-only endpoint, so sync
    # query embeddings intermittently 404 and retrieval silently returns nothing
    # (has_doc_source failures). openai/text-embedding-3-small is stable on the
    # sync /embeddings endpoint (1536 dims, ~$0.02/M).
    env:
      OPENROUTER_MODEL: google/gemini-2.5-flash-lite
      RAG_TIER1_MODEL: google/gemini-2.5-flash-lite
      RAG_TIER2_MODEL: google/gemini-2.5-flash-lite
      RAG_TIER3_MODEL: google/gemini-2.5-flash-lite
      EMBEDDING_MODEL: openai/text-embedding-3-small
      EMBEDDING_STRATEGY: sequential

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      - name: Run code formatting and linting
        run: uv run ruff check .

      - name: Run unit, API & stress test suites
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY || 'sk-mock-key-for-ci' }}
        run: uv run pytest tests/test_ui_api.py tests/integration/test_stress.py -v

      # CI runners start from a fresh checkout where data/ (vector store, graph
      # store) is gitignored and therefore absent. Without an ingested corpus the
      # eval agent searches an empty store, every document-grounded question fails
      # its has_doc_source check, and the report shows 0% pass — even with a valid
      # OPENROUTER_API_KEY (the pre-fix symptom was a 401 on every LLM call because
      # the secret was unset and the mock fallback key was used). Build the main
      # corpus here so the benchmark actually exercises retrieval.
      # EMBEDDING_STRATEGY=sequential avoids the OpenRouter beta batches endpoint
      # (submit + poll) and keeps this step deterministic.
      - name: Build retrieval corpus for evaluation
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY || 'sk-mock-key-for-ci' }}
          EMBEDDING_STRATEGY: sequential
        run: uv run python -m nga.ingestion.build_vector_store --profile main

      - name: Execute Evaluation Benchmark Suite
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY || 'sk-mock-key-for-ci' }}
          EMBEDDING_STRATEGY: sequential
        run: |
          # Run benchmark smoke evaluation across categories
          uv run python -c "
          from nga.evaluation.eval_runner import run_evaluation_suite, load_eval_questions
          from nga.graph.orchestrator import build_orchestrator
          from nga.ui.server import ctx
          import os

          # Run smoke suite across all 6 categories (including stress)
          questions = load_eval_questions(smoke_test=True)
          ctx.setup()
          graph = ctx.get_graph('manager')
          summary, results, md_path, json_path = run_evaluation_suite(
              agent_graph=graph,
              questions=questions,
              run_label='ci_' + os.getenv('GITHUB_SHA', 'local')[:7],
          )
          print(f'Evaluation finished: Pass Rate={summary[\"pass_rate\"]*100:.1f}%, Report={json_path}')
          "

      - name: Track Evaluation & Generate Visualizations
        run: |
          # Record evaluation into historical ledger, generate SVG charts and GitHub step summary
          LATEST_REPORT=$(ls -t reports/eval/*.json | head -n 1)
          echo "Processing latest report: $LATEST_REPORT"
          uv run python -m nga.evaluation.ci_tracker \
            --report-file "$LATEST_REPORT" \
            --generate-svg "reports/eval/trends.svg" \
            --github-summary \
            --fail-on-regression \
            --threshold 0.70

      - name: Upload Evaluation Reports & Trend Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nga-evaluation-history
          path: |
            reports/eval/*.json
            reports/eval/*.md
            reports/eval/*.svg
          retention-days: 30
